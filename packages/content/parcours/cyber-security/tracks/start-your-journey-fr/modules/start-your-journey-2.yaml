  teacherCorrectionGuide:
    expectedAnswers:
      note: "Ces éléments sont les réponses attendues — ne pas partager avec les élèves avant la mission."
      pageCiblee: /client-portal/
      ipSuspecte: "192.168.56.23"
      referenceClient: MTS-CL-2048
      comportement: "Reconnaissance web suivie de tentatives d'accès au portail client"
      profilFictif: NorthTrail
      codeValidation: MTS-BLUE-2048
    commonMisconceptions:
    - misconception: Une alerte critique signifie qu'il faut tout supprimer immédiatement.
      correction: Il faut confirmer, préserver les preuves, contenir l'incident et suivre une procédure.
    - misconception: Bloquer une IP corrige complètement l'incident.
      correction: Le blocage peut contenir l'activité, mais il ne corrige pas le portail mal protégé ni l'information exposée.
    - misconception: Un code HTTP 200 prouve toujours qu'une attaque complète a réussi.
      correction: Un code 200 indique une réponse réussie, mais il faut interpréter le contexte et les autres preuves.
    - misconception: Le renseignement sur la menace donne toujours l'identité réelle d'un attaquant.
      correction: Il aide surtout à reconnaître des comportements et des indicateurs. L'attribution doit rester prudente.
    - misconception: Les journaux sont seulement utiles après un incident majeur.
      correction: Les journaux sont essentiels pour détecter, comprendre et documenter même un incident limité.
    - misconception: Une recommandation défensive doit être compliquée pour être professionnelle.
      correction: Une bonne recommandation peut être simple si elle corrige réellement la cause du risque.
    suggestedFeedbackForChallenge:
      excellent: Très bon rapport d'incident. Les preuves sont bien utilisées, la séquence d'attaque est claire, le containment est raisonnable et les recommandations corrigent les causes principales du problème.
      satisfactory: Bon travail. L'incident est identifié et les éléments principaux sont présents. Pour améliorer le rapport, ajoute davantage de liens entre les journaux, la référence client exposée et les mesures de containment.
      needsImprovement: Le rapport est incomplet ou trop vague. Reprends la structure demandée, identifie la page ciblée, l'adresse IP suspecte, les preuves dans les journaux, le code de validation et les recommandations défensives.
  metadata:
    version: '1.0'
    author: Steeve Levesque / NEXUS
    createdFor: Parcours Start your journey
    notes: 'Première version de la mission défensive blue team. Elle complète la mission offensive du portail client oublié de Maple Tech Solutions.'
    implementationSummaryForClaudeCode: |-
      Résumé des éléments à implémenter dans le site fictif Maple Tech Solutions pour cette mission défensive.

      Créer une section SOC simulée entièrement statique en HTML, CSS et JavaScript vanilla. Ne pas utiliser React,
      Node.js, backend, base de données ou API réelle. Les pages doivent fonctionner sous Apache2 dans /var/www/html/.

      Pages ou chemins souhaités :
      - /soc/ ou /soc/index.html : tableau de bord SOC avec l'alerte principale.
      - /soc/logs.html : visionneuse de journaux web simulés.
      - /soc/threat-intel.html : fiche ou recherche du profil fictif NorthTrail.
      - /soc/containment.html : console de containment simulée avec choix d'actions.
      - /soc/report.html : page de soutien au rapport d'incident ou résumé des champs attendus.

      Données clés à afficher :
      - alerte : Activité suspecte sur le portail client.
      - sévérité : Critique.
      - source IP : 192.168.56.23.
      - page ciblée : /client-portal/.
      - type : reconnaissance web suivie de tentatives d'accès.
      - référence utilisée dans le scénario : MTS-CL-2048.
      - acteur fictif : NorthTrail.
      - code de validation final : MTS-BLUE-2048.

      Journaux web simulés à inclure :
      - 09:40:12  192.168.56.23  GET   /                 200
      - 09:40:18  192.168.56.23  GET   /services.html     200
      - 09:40:31  192.168.56.23  GET   /backup/           200
      - 09:40:36  192.168.56.23  GET   /dev-notes/        200
      - 09:40:41  192.168.56.23  GET   /client-portal/    200
      - 09:41:02  192.168.56.23  POST  /client-portal/    403
      - 09:41:18  192.168.56.23  POST  /client-portal/    403
      - 09:41:29  192.168.56.23  POST  /client-portal/    200

      Profil NorthTrail à simuler :
      - découverte de répertoires web;
      - consultation de dossiers de sauvegarde exposés;
      - recherche de notes de développement oubliées;
      - tentatives sur des portails clients;
      - abus de références client visibles publiquement;
      - indicateurs : requêtes rapides vers /backup/, /dev-notes/, /uploads/ et /client-portal/, puis plusieurs POST vers le portail.

      Console de containment :
      - proposer plusieurs actions, dont certaines bonnes et certaines mauvaises;
      - bonnes actions : préserver les journaux, bloquer temporairement 192.168.56.23, désactiver temporairement /client-portal/, aviser la personne responsable;
      - mauvaises actions possibles : effacer les journaux, supprimer tout le site, ignorer l'alerte, publier les détails de l'incident;
      - afficher MTS-BLUE-2048 seulement si les bonnes actions sont sélectionnées.

      Le style doit rester cohérent avec Maple Tech Solutions : professionnel, crédible, simple, responsive,
      avec une ambiance de tableau de bord de sécurité débutant. Les outils doivent être clairement fictifs mais réalistes.
