  teacherCorrectionGuide:
    commonMisconceptions:
      - misconception: "Si un patron le demande, c'est automatiquement autorisé."
        correction: "Une demande doit respecter les politiques, la portée, les rôles et les règles de protection des renseignements personnels."
      - misconception: "Un technicien administrateur peut consulter toutes les données."
        correction: "Le rôle technique ne donne pas automatiquement le droit d'accéder aux données. Il faut un besoin réel et une autorisation."
      - misconception: "Un NDA donne le droit d'accéder à tout."
        correction: "Un NDA encadre la confidentialité des informations, mais ne remplace pas la portée du mandat."
      - misconception: "Si je découvre des données par hasard, je peux les explorer pour vérifier."
        correction: "Il faut limiter l'exploration, documenter minimalement et signaler la découverte à la personne responsable."
      - misconception: "Partager un mot de passe est acceptable si c'est plus rapide."
        correction: "Le partage de mot de passe nuit à la traçabilité et peut créer des risques d'abus ou de responsabilité."
    suggestedFeedbackForChallenge:
      excellent: |
        Très bonne analyse. Tu identifies clairement les enjeux d'autorisation, de portée,
        de vie privée et de documentation. Les décisions proposées sont prudentes, réalistes
        et adaptées au rôle d'un technicien.
      satisfactory: |
        Bonne base. Tu reconnais les principaux risques, mais certaines décisions devraient être
        mieux justifiées ou mieux reliées à la portée du mandat et au principe du minimum nécessaire.
      needsImprovement: |
        L'analyse est trop rapide ou trop centrée sur l'action technique. Reprends chaque scénario
        en vérifiant l'autorisation, les données concernées, les risques, la documentation et l'escalade.

