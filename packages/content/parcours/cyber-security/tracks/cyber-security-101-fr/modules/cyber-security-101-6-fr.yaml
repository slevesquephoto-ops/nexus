  teacherCorrectionGuide:
    commonMisconceptions:
    - misconception: Trouver un répertoire signifie qu'on a le droit d'explorer tout son contenu.
      correction: La découverte doit rester dans la portée. On documente ce qui est observé sans dépasser l'autorisation.
    - misconception: Un code 403 signifie que la ressource n'existe pas.
      correction: Un code 403 indique plutôt que l'accès est refusé. La ressource peut exister.
    - misconception: dirb trouve toutes les vulnérabilités d'un site web.
      correction: dirb découvre des chemins web à partir d'une wordlist. Il ne remplace pas une analyse complète.
    - misconception: Si une référence client est visible publiquement, elle peut être utilisée comme mécanisme d'accès.
      correction: Une information publique ne devrait jamais remplacer une vraie authentification.
    - misconception: Un portail caché est sécuritaire parce qu'il n'apparaît pas dans le menu.
      correction: Une page cachée mais accessible peut être découverte par reconnaissance ou par erreur de configuration.
    - misconception: Un rapport doit seulement contenir des captures d'écran.
      correction: Les captures doivent être accompagnées de contexte, d'analyse et de recommandations.
    suggestedFeedbackForChallenge:
      excellent: Très bon rapport de mission. La cible et la portée sont claires, les services ont été vérifiés, le portail
        client a été trouvé, le code de validation est fourni et le risque est bien expliqué avec des recommandations réalistes.
      satisfactory: Bon travail. La mission est complétée et les principaux résultats sont présents. Pour améliorer le rapport,
        ajoute davantage de contexte aux preuves ou explique plus clairement le lien entre la référence publique, le portail
        oublié et le risque de sécurité.
      needsImprovement: Le rapport est incomplet ou manque de précision. Reprends la structure demandée, vérifie que la cible
        est bien http://localhost, ajoute des preuves lisibles, fournis le code de validation et explique le risque principal
        du scénario.
