module:
  id: cyber-security-101-5-fr
  trackId: cyber-security-101-fr
  title: "Environnement de laboratoire"
  description: "Préparer une machine virtuelle, comprendre localhost, vérifier les outils et respecter les limites d’un laboratoire autorisé"
  order: 5
  mascot: "tux-terminal"
  xpReward: 80
  language: fr

  # ── Métadonnées pédagogiques (pour référence enseignant — non chargées en DB) ──

  estimatedDuration: "1h30"
  level: beginner

  summary: |
    Ce module prépare l'élève à travailler dans un environnement de laboratoire contrôlé.
    Avant de manipuler un outil de reconnaissance web, l'élève doit comprendre ce qu'est une cible
    locale, pourquoi l'environnement est isolé et quelles limites doivent être respectées.

    Le module introduit les notions de machine virtuelle, de localhost, de cible autorisée,
    de réseau local et de validation d'environnement. Il permet aussi de vérifier que les outils
    essentiels sont disponibles avant la première mission offensive du parcours.

  pedagogicalIntent: |
    Ce module sert de transition entre les notions éthiques et la première mission technique.
    L'objectif est de développer un réflexe important : avant d'utiliser un outil de cybersécurité,
    l'élève doit savoir où il se trouve, quelle cible est autorisée, quelles actions sont permises
    et quelles preuves doivent être remises.

    Le module doit aussi éviter une confusion fréquente chez les débutants : tester localhost dans
    un laboratoire n'est pas la même chose que tester un site web public, une adresse IP inconnue,
    un serveur de l'école ou l'appareil d'un autre élève.

  learningOutcomes:
    - "Comprendre le rôle d'un laboratoire contrôlé en cybersécurité."
    - "Expliquer la différence entre une cible locale et une cible externe."
    - "Définir localhost dans le contexte d'une machine virtuelle."
    - "Identifier les limites d'une cible autorisée dans un exercice NEXUS."
    - "Vérifier la présence des outils essentiels avant une mission technique."
    - "Produire un court rapport de préparation avec des preuves simples."

  prerequisites:
    - "Avoir complété le module 1 du parcours Cyber Security 101."
    - "Avoir complété le module 2 du parcours Cyber Security 101."
    - "Avoir complété le module 3 du parcours Cyber Security 101."
    - "Avoir complété le module 4 du parcours Cyber Security 101."
    - "Comprendre l'importance de l'autorisation et de la portée d'un mandat."
    - "Savoir ouvrir un terminal Linux et exécuter une commande simple."

    - type: teacher_note
      title: "Intention pédagogique"
      content: |
        Ce module est volontairement pratique, mais il ne s'agit pas encore d'une mission offensive complète.
        L'élève doit surtout apprendre à valider son environnement, à reconnaître une cible autorisée
        et à documenter sa préparation.

        Il est recommandé de rappeler que la cybersécurité professionnelle commence avant l'outil :
        on vérifie d'abord la cible, la portée, l'environnement, les consignes et les preuves attendues.

        Questions de discussion suggérées :
        - Pourquoi utilise-t-on une cible locale pour un premier laboratoire?
        - Quelle est la différence entre http://localhost et un site web public?
        - Pourquoi faut-il éviter de scanner des adresses inconnues?
        - Quelles preuves simples peuvent démontrer qu'un laboratoire est prêt?

  vocabulary:
    - term: "Laboratoire contrôlé"
      fr: "Laboratoire contrôlé"
      definition: "Environnement préparé pour pratiquer des actions techniques sans viser de systèmes non autorisés."
    - term: "Machine virtuelle"
      fr: "Virtual machine"
      definition: "Ordinateur simulé qui fonctionne à l'intérieur d'un ordinateur physique."
    - term: "Localhost"
      fr: "Localhost"
      definition: "Nom qui désigne la machine locale, souvent associé à l'adresse 127.0.0.1."
    - term: "Cible autorisée"
      fr: "Authorized target"
      definition: "Système ou service que l'élève a explicitement le droit d'utiliser dans l'exercice."
    - term: "Cible externe"
      fr: "External target"
      definition: "Système situé hors du laboratoire, par exemple un site public, un serveur réel ou un appareil qui n'appartient pas à l'exercice."
    - term: "Portée"
      fr: "Scope"
      definition: "Limites de ce qui est permis pendant une activité ou une mission."
    - term: "Terminal"
      fr: "Terminal"
      definition: "Interface permettant d'exécuter des commandes textuelles."
    - term: "Apache2"
      fr: "Apache2"
      definition: "Serveur web qui peut héberger un site local dans le laboratoire."
    - term: "dirb"
      fr: "dirb"
      definition: "Outil utilisé pour découvrir des répertoires web sur une cible autorisée."

  safetyReminder: |
    Dans ce module, la cible autorisée est locale. Les élèves ne doivent pas tester de sites web publics,
    d'adresses IP inconnues, de serveurs de l'école, d'appareils personnels ou d'appareils appartenant
    à d'autres élèves. Toute activité technique doit rester dans le laboratoire prévu par l'enseignant.

  # ── Tâches ────────────────────────────────────────────────────────────────────

  tasks:

    # ── TÂCHE 1 ───────────────────────────────────────────────────────────────
    - id: cyber-security-101-5-fr-t1
      type: task
      title: "Comprendre le fonctionnement des laboratoires NEXUS"
      order: 1
      xpReward: 10
      objectives:
        - "Comprendre pourquoi les activités de cybersécurité doivent se faire dans un environnement contrôlé."
        - "Distinguer une mission guidée d'un scénario autonome."
        - "Identifier les preuves attendues dans un laboratoire technique."
      sections:

        - type: theory
          title: "Pourquoi un laboratoire contrôlé?"
          content: |
            En cybersécurité, plusieurs outils peuvent envoyer des requêtes, analyser des services,
            découvrir des répertoires ou tester des configurations. Ces outils peuvent être légitimes
            lorsqu'ils sont utilisés dans un cadre autorisé, mais ils deviennent problématiques s'ils sont
            utilisés contre une cible non autorisée.

            Un laboratoire contrôlé permet de pratiquer sans viser un système réel qui ne fait pas partie
            du cours. L'enseignant fournit une cible, des limites et des consignes. L'élève peut donc
            apprendre les bons gestes sans dépasser le cadre permis.

        - type: theory
          title: "Mission guidée et scénario autonome"
          content: |
            Dans NEXUS, une mission guidée accompagne l'élève étape par étape. Elle est utile pour découvrir
            une nouvelle notion ou un nouvel outil.

            Un scénario autonome donne plutôt une situation, un objectif et des contraintes. L'élève doit
            alors choisir davantage sa méthode, justifier ses actions et produire une preuve de son travail.

            Dans les deux cas, une règle demeure : la cible doit être autorisée et la portée doit être respectée.

        - type: theory
          title: "Les preuves attendues"
          content: |
            En cybersécurité, il ne suffit pas de dire qu'une action a été faite. Il faut souvent produire
            des preuves claires et utiles.

            Exemples de preuves :
            - une capture d'écran d'une commande;
            - une capture d'écran d'un résultat;
            - une commande utilisée;
            - une observation technique;
            - une courte explication;
            - une recommandation;
            - une conclusion professionnelle.

            Une bonne preuve doit permettre à une autre personne de comprendre ce qui a été fait,
            sur quelle cible et dans quel contexte.

        - type: command_table
          commands:
            - cmd: "Mission guidée"
              desc: "Activité étape par étape pour apprendre une nouvelle notion"
            - cmd: "Scénario autonome"
              desc: "Activité où l'élève doit analyser, choisir une méthode et justifier ses actions"
            - cmd: "Preuve"
              desc: "Capture, résultat ou explication qui démontre le travail réalisé"
            - cmd: "Cible autorisée"
              desc: "Système explicitement permis dans l'exercice"
            - cmd: "Portée"
              desc: "Limites de ce qui est permis"

        - type: questions
          items:
            - id: t1-q1
              type: qcm
              question: "Pourquoi utilise-t-on un laboratoire contrôlé en cybersécurité?"
              answers:
                - text: "Pour pratiquer dans un cadre autorisé sans viser des systèmes externes"
                  correct: true
                - text: "Pour pouvoir tester n'importe quel site web public"
                  correct: false
                - text: "Pour éviter complètement la documentation"
                  correct: false
                - text: "Pour contourner les règles d'autorisation"
                  correct: false

            - id: t1-q2
              type: qcm
              question: "Quelle affirmation décrit le mieux une mission guidée?"
              answers:
                - text: "Une activité qui accompagne l'élève étape par étape"
                  correct: true
                - text: "Une activité sans consignes et sans limite"
                  correct: false
                - text: "Une permission de tester des systèmes externes"
                  correct: false
                - text: "Une activité qui ne demande jamais de preuve"
                  correct: false

            - id: t1-q3
              type: short_answer
              question: "Quel mot désigne une capture, un résultat ou une explication qui démontre le travail réalisé?"
              answer: "preuve"

    # ── TÂCHE 2 ───────────────────────────────────────────────────────────────
    - id: cyber-security-101-5-fr-t2
      type: task
      title: "Machine virtuelle, localhost et cible locale"
      order: 2
      xpReward: 10
      objectives:
        - "Comprendre le rôle d'une machine virtuelle dans un laboratoire de cybersécurité."
        - "Définir localhost et reconnaître son utilité dans une cible locale."
        - "Différencier une cible locale d'une cible externe."
      sections:

        - type: theory
          title: "La machine virtuelle"
          content: |
            Une machine virtuelle est un ordinateur simulé qui fonctionne à l'intérieur d'un ordinateur physique.
            Elle peut avoir son propre système d'exploitation, ses propres logiciels, ses propres fichiers
            et parfois sa propre configuration réseau.

            Dans un cours de cybersécurité, une machine virtuelle est utile parce qu'elle permet de préparer
            un environnement reproductible. Tous les élèves peuvent travailler dans un contexte semblable,
            avec les mêmes outils et les mêmes limites.

        - type: theory
          title: "Comprendre localhost"
          content: |
            localhost désigne la machine locale. Lorsqu'un élève ouvre http://localhost dans sa machine virtuelle,
            il communique avec un service qui fonctionne sur cette même machine virtuelle.

            En pratique, localhost pointe souvent vers l'adresse 127.0.0.1. Cette adresse ne représente pas
            un site web public. Elle représente la machine elle-même.

            Cela permet de créer une cible locale pour apprendre sans envoyer de requêtes vers Internet
            ou vers un système externe.

        - type: theory
          title: "Cible locale ou cible externe?"
          content: |
            Une cible locale est préparée dans le laboratoire. Elle appartient à l'exercice et l'élève
            a l'autorisation de l'utiliser.

            Une cible externe est un système qui ne fait pas partie de l'exercice : site web public,
            serveur d'une entreprise, adresse IP inconnue, appareil d'un autre élève, imprimante réseau
            de l'école ou service infonuagique réel.

            Dans ce parcours, la première cible technique sera une cible locale nommée Maple Tech Solutions,
            hébergée sur la machine virtuelle de l'élève.

        - type: command_table
          commands:
            - cmd: "localhost"
              desc: "Nom qui désigne la machine locale"
            - cmd: "127.0.0.1"
              desc: "Adresse IP de boucle locale généralement associée à localhost"
            - cmd: "http://localhost"
              desc: "Adresse utilisée pour visiter un serveur web local"
            - cmd: "Machine virtuelle"
              desc: "Ordinateur simulé utilisé pour le laboratoire"
            - cmd: "Cible externe"
              desc: "Système qui ne fait pas partie du laboratoire autorisé"

        - type: questions
          items:
            - id: t2-q1
              type: qcm
              question: "Que représente généralement localhost?"
              answers:
                - text: "La machine locale utilisée par l'élève"
                  correct: true
                - text: "Un site web public choisi au hasard"
                  correct: false
                - text: "Le compte Microsoft 365 de l'enseignant"
                  correct: false
                - text: "Un serveur externe automatiquement autorisé"
                  correct: false

            - id: t2-q2
              type: qcm
              question: "Quelle cible respecte le mieux la portée du laboratoire de ce parcours?"
              answers:
                - text: "http://localhost dans la machine virtuelle de l'élève"
                  correct: true
                - text: "Le site web public d'une entreprise réelle"
                  correct: false
                - text: "L'ordinateur personnel d'un autre élève"
                  correct: false
                - text: "Une adresse IP inconnue trouvée sur Internet"
                  correct: false

            - id: t2-q3
              type: short_answer
              question: "Quelle adresse IP est souvent associée à localhost?"
              answer: "127.0.0.1"

    # ── TÂCHE 3 ───────────────────────────────────────────────────────────────
    - id: cyber-security-101-5-fr-t3
      type: task
      title: "Outils essentiels du laboratoire"
      order: 3
      xpReward: 10
      objectives:
        - "Identifier les outils qui seront utilisés dans la première mission technique."
        - "Comprendre le rôle d'Apache2, du navigateur, du terminal et de dirb."
        - "Vérifier qu'un outil est installé ou disponible."
      sections:

        - type: theory
          title: "Les outils du premier laboratoire"
          content: |
            Avant d'effectuer une mission technique, il faut vérifier les outils qui seront utilisés.
            Dans ce parcours, la première mission offensive contrôlée utilisera une cible web locale.

            Le navigateur permettra de visiter la cible locale.
            Le terminal permettra d'exécuter les commandes.
            Apache2 permettra d'héberger un petit site web local.
            dirb permettra de découvrir des répertoires web sur la cible autorisée.

            Ces outils ne doivent pas être utilisés contre des cibles externes dans ce module.

        - type: theory
          title: "Apache2"
          content: |
            Apache2 est un serveur web. Dans le laboratoire, il servira à héberger la cible fictive
            Maple Tech Solutions sur la machine virtuelle de l'élève.

            Lorsqu'Apache2 fonctionne correctement, l'élève pourra visiter http://localhost dans son navigateur
            et voir une page web servie par sa propre machine virtuelle.

        - type: theory
          title: "dirb"
          content: |
            dirb est un outil de découverte de répertoires web. Il teste une liste de noms possibles
            afin de voir si certains chemins existent sur une cible web autorisée.

            Dans ce module, il suffit de savoir que dirb sera utilisé plus tard contre http://localhost.
            L'analyse complète de dirb sera faite dans le prochain module.

        - type: command_table
          commands:
            - cmd: "firefox http://localhost"
              desc: "Ouvre la cible locale dans le navigateur, si Firefox est disponible"
            - cmd: "apache2 -v"
              desc: "Affiche la version d'Apache2 si le paquet est installé"
            - cmd: "systemctl status apache2 --no-pager"
              desc: "Affiche l'état du service Apache2"
            - cmd: "dirb"
              desc: "Affiche l'aide ou le comportement de base de dirb si l'outil est installé"
            - cmd: "ip addr"
              desc: "Affiche les interfaces réseau de la machine"
            - cmd: "curl http://localhost"
              desc: "Teste une requête vers le serveur web local"

        - type: questions
          items:
            - id: t3-q1
              type: qcm
              question: "Quel outil servira à héberger la cible web locale?"
              answers:
                - text: "Apache2"
                  correct: true
                - text: "LibreOffice Writer"
                  correct: false
                - text: "Gestionnaire de fichiers"
                  correct: false
                - text: "Calculatrice"
                  correct: false

            - id: t3-q2
              type: qcm
              question: "Quel outil sera utilisé plus tard pour découvrir des répertoires web sur la cible autorisée?"
              answers:
                - text: "dirb"
                  correct: true
                - text: "nano"
                  correct: false
                - text: "passwd"
                  correct: false
                - text: "history"
                  correct: false

            - id: t3-q3
              type: short_answer
              question: "Quelle commande permet de tester une requête vers le serveur web local?"
              answer: "curl http://localhost"

    # ── TÂCHE 4 ───────────────────────────────────────────────────────────────
    - id: cyber-security-101-5-fr-t4
      type: task
      title: "Vérification de préparation"
      order: 4
      xpReward: 10
      objectives:
        - "Effectuer une vérification simple de l'environnement avant une mission."
        - "Identifier les éléments à capturer comme preuves."
        - "Rédiger une courte note de préparation."
      sections:

        - type: theory
          title: "Vérifier avant d'agir"
          content: |
            Un bon réflexe technique consiste à vérifier l'environnement avant de commencer une mission.
            Cela évite de perdre du temps, de viser la mauvaise cible ou de produire des résultats difficiles
            à interpréter.

            Avant la prochaine mission, l'élève doit être capable de confirmer :
            - que la machine virtuelle fonctionne;
            - que le terminal est accessible;
            - que la cible prévue est locale;
            - que les outils nécessaires sont installés ou prêts à être installés;
            - que les limites du laboratoire sont comprises.

        - type: theory
          title: "Preuves recommandées"
          content: |
            Pour démontrer qu'un laboratoire est prêt, il faut fournir des preuves simples et lisibles.

            Exemples :
            - une capture d'écran de la machine virtuelle;
            - une capture d'écran du terminal;
            - une commande montrant l'état d'Apache2;
            - une commande montrant que dirb est disponible;
            - une courte phrase expliquant pourquoi localhost est une cible autorisée.

        - type: theory
          title: "Exemple de note professionnelle"
          content: |
            Exemple :

            Mon environnement de laboratoire est prêt. La cible utilisée dans ce parcours est locale,
            car http://localhost pointe vers ma propre machine virtuelle. Je comprends que je ne dois pas
            tester de site web public, d'adresse IP externe ou d'appareil appartenant à une autre personne.

        - type: command_table
          commands:
            - cmd: "hostname"
              desc: "Affiche le nom de la machine"
            - cmd: "whoami"
              desc: "Affiche l'utilisateur courant"
            - cmd: "ip addr"
              desc: "Affiche les informations réseau"
            - cmd: "apache2 -v"
              desc: "Vérifie si Apache2 est disponible"
            - cmd: "dirb"
              desc: "Vérifie si dirb répond"
            - cmd: "curl http://localhost"
              desc: "Teste la cible web locale si Apache2 fonctionne"

        - type: questions
          items:
            - id: t4-q1
              type: qcm
              question: "Quelle preuve serait pertinente pour montrer que le terminal est accessible?"
              answers:
                - text: "Une capture d'écran du terminal avec une commande simple"
                  correct: true
                - text: "Une photo d'une chaise devant l'ordinateur"
                  correct: false
                - text: "Un message disant seulement que tout fonctionne"
                  correct: false
                - text: "Une capture d'écran d'un site public non lié au laboratoire"
                  correct: false

            - id: t4-q2
              type: qcm
              question: "Quelle phrase respecte le mieux les limites du laboratoire?"
              answers:
                - text: "Je teste seulement la cible locale fournie dans l'exercice."
                  correct: true
                - text: "Je peux tester n'importe quelle adresse si l'outil fonctionne."
                  correct: false
                - text: "Je peux scanner l'appareil d'un collègue si je suis curieux."
                  correct: false
                - text: "Je peux ignorer la portée si le résultat semble intéressant."
                  correct: false

            - id: t4-q3
              type: short_answer
              question: "Quel nom désigne la machine locale dans l'adresse http://localhost?"
              answer: "localhost"

    # ── CHALLENGE ─────────────────────────────────────────────────────────────
    - id: cyber-security-101-5-fr-c1
      type: challenge
      title: "Rapport de préparation du laboratoire"
      order: 5
      xpReward: 40
      objectives:
        - "Valider que l'environnement de laboratoire est prêt."
        - "Produire des preuves simples et utiles."
        - "Expliquer clairement pourquoi la cible locale est autorisée."
      sections:

        - type: theory
          title: "Mission"
          content: |
            Dans ce défi, tu dois produire un court rapport de préparation du laboratoire.
            Le but est de démontrer que tu comprends l'environnement avant de passer à la première
            mission offensive contrôlée du parcours.

            Tu ne dois pas scanner de cible externe. Tu dois seulement vérifier ton environnement local,
            tes outils et ta compréhension des limites du laboratoire.

        - type: theory
          title: "Ce que ton rapport doit contenir"
          content: |
            Ton rapport doit contenir les éléments suivants :

            1. Le nom de la machine ou de la VM utilisée.
            2. Une preuve que le terminal fonctionne.
            3. Une preuve liée à Apache2.
            4. Une preuve liée à dirb.
            5. Une courte explication de ce que représente localhost.
            6. Une phrase confirmant que tu comprends les limites du laboratoire.

            Tu peux remettre ton travail sous forme de court document, de captures d'écran annotées
            ou de réponse structurée dans NEXUS, selon les consignes de ton enseignant.

        - type: theory
          title: "Limites à respecter"
          content: |
            Pour ce défi, les limites sont les suivantes :

            - cible autorisée : ta machine locale seulement;
            - adresse permise : http://localhost;
            - aucun test sur un site web public;
            - aucun test sur une adresse IP inconnue;
            - aucun test sur un appareil appartenant à un autre élève;
            - aucune tentative de contournement ou d'accès non autorisé.

            Si un résultat ne fonctionne pas, documente-le simplement. Le but de ce défi est la préparation,
            pas la performance parfaite.

        - type: theory
          title: "Exemple de structure de réponse"
          content: |
            Tu peux utiliser cette structure :

            1. Environnement utilisé
            2. Vérification du terminal
            3. Vérification d'Apache2
            4. Vérification de dirb
            5. Explication de localhost
            6. Limites du laboratoire
            7. Conclusion

        - type: command_table
          commands:
            - cmd: "hostname"
              desc: "Commande possible pour identifier la machine"
            - cmd: "whoami"
              desc: "Commande possible pour identifier l'utilisateur courant"
            - cmd: "apache2 -v"
              desc: "Commande possible pour vérifier Apache2"
            - cmd: "systemctl status apache2 --no-pager"
              desc: "Commande possible pour vérifier l'état du service Apache2"
            - cmd: "dirb"
              desc: "Commande possible pour vérifier que dirb est disponible"
            - cmd: "curl http://localhost"
              desc: "Commande possible pour tester la cible locale si Apache2 fonctionne"

        - type: theory
          title: "Conseils pour réussir"
          content: |
            Ton rapport doit être clair, court et professionnel. Il n'est pas nécessaire d'écrire un long texte.
            Une bonne remise montre que tu sais :

            - où tu travailles;
            - quelle cible est autorisée;
            - quels outils seront utilisés;
            - quelles preuves démontrent que ton environnement est prêt;
            - quelles limites tu dois respecter.

            Si une commande produit une erreur, ne cache pas l'erreur. Fais une capture et explique brièvement
            ce que tu observes. En soutien informatique, documenter un problème fait partie du travail.

      expectedDeliverables:
        - "Un court rapport de préparation en français."
        - "Une capture d'écran ou une preuve montrant que la machine virtuelle fonctionne."
        - "Une capture d'écran ou une preuve montrant que le terminal est accessible."
        - "Une preuve liée à Apache2."
        - "Une preuve liée à dirb."
        - "Une explication de 3 à 5 phrases sur localhost et les limites du laboratoire."
      successCriteria:
        - "L'élève identifie correctement son environnement de laboratoire."
        - "L'élève comprend que localhost représente la machine locale."
        - "L'élève respecte les limites de la cible autorisée."
        - "Les preuves sont lisibles et pertinentes."
        - "La conclusion démontre une compréhension des règles de sécurité du laboratoire."
      suggestedTableColumns:
        - "Élément vérifié"
        - "Commande ou preuve"
        - "Résultat observé"
        - "Capture fournie"
        - "Commentaire"
      gradingRubric:
        - criterion: "Identification de l'environnement"
          points: 5
          description: "L'élève identifie clairement la machine ou la VM utilisée."
        - criterion: "Preuves techniques"
          points: 15
          description: "L'élève fournit des preuves pertinentes pour le terminal, Apache2 et dirb."
        - criterion: "Compréhension de localhost"
          points: 10
          description: "L'élève explique correctement que localhost représente la machine locale."
        - criterion: "Respect de la portée"
          points: 5
          description: "L'élève confirme qu'il ne teste pas de cible externe ou non autorisée."
        - criterion: "Clarté du rapport"
          points: 5
          description: "Le rapport est organisé, lisible et professionnel."

