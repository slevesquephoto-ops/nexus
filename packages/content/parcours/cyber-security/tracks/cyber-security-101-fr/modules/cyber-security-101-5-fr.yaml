      - "L'élève comprend le rôle d'un laboratoire contrôlé."
      - "L'élève peut expliquer la différence entre une cible locale et une cible externe."
      - "L'élève peut expliquer ce que représente localhost."
      - "L'élève peut identifier les outils essentiels du prochain laboratoire."
      - "L'élève a remis un rapport de préparation avec des preuves pertinentes."
