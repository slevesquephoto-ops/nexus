  teacherCorrectionGuide:
    commonMisconceptions:
      - misconception: "localhost est un site web public."
        correction: "localhost désigne la machine locale. Dans ce laboratoire, il s'agit de la VM de l'élève."
      - misconception: "Si un outil est installé, je peux l'utiliser contre n'importe quelle cible."
        correction: "L'utilisation d'un outil dépend toujours de l'autorisation et de la portée."
      - misconception: "Une capture d'écran suffit même si on ne sait pas ce qu'elle montre."
        correction: "Une preuve doit être lisible, pertinente et accompagnée d'un minimum de contexte."
      - misconception: "Une erreur de commande signifie automatiquement un échec."
        correction: "En soutien informatique, une erreur observée et bien documentée peut être une preuve utile."
      - misconception: "Un laboratoire local n'a pas besoin de règles."
        correction: "Même en laboratoire, les règles de cible autorisée et de portée doivent être respectées."
    suggestedFeedbackForChallenge:
      excellent: |
        Très bon rapport de préparation. Les preuves sont claires, les outils sont vérifiés et l'explication
        de localhost montre que tu comprends bien les limites du laboratoire.
      satisfactory: |
        Bonne base. Les éléments essentiels sont présents, mais certaines preuves ou explications pourraient
        être plus claires. Ajoute davantage de contexte pour montrer ce que chaque capture démontre.
      needsImprovement: |
        Le rapport est incomplet ou trop vague. Reprends les consignes et fournis des preuves précises pour
        l'environnement, le terminal, Apache2, dirb et la compréhension de localhost.

