    # ── TASK 9 ────────────────────────────────────────────────────────────────
    - id: linux-fund-1-en-t9
      type: task
      title: "Reading Without Modifying: cat, head, tail, wc -l"
      order: 9
      xpReward: 15
      objectives:
        - "Read the full contents of a file."
        - "Read the beginning or end of a file."
        - "Count the number of lines in a file."
      sections:
        - type: theory
          title: "Read Before You Modify"
          content: |
            Reading files is a fundamental skill in IT support.
            Before modifying a configuration or running a diagnostic, you often need to
            consult text files: notes, system information, logs, lists,
            reports, or configuration files.

            In this module, we limit ourselves to commands that read information without
            modifying the system.

        - type: command_table
          title: "Reading Commands"
          commands:
            - cmd: "cat fichier.txt"
              desc: "Displays the complete contents of a file."
            - cmd: "head fichier.txt"
              desc: "Displays the first 10 lines of a file."
            - cmd: "tail fichier.txt"
              desc: "Displays the last 10 lines of a file."
            - cmd: "wc -l fichier.txt"
              desc: "Counts the number of lines in a file."

        - type: code_block
          label: "Reading Basic System Information"
          content: |
            student@nexus-vm:~$ cat /etc/hostname
            nexus-vm

            student@nexus-vm:~$ cat /etc/os-release
            PRETTY_NAME="Ubuntu 24.04 LTS"
            NAME="Ubuntu"
            VERSION_ID="24.04"

        - type: code_block
          label: "Reading a Demo File"
          content: |
            student@nexus-vm:~$ cat ~/nexus/rapport.txt
            Ligne 1...
            Ligne 2...
            Ligne 3...

            student@nexus-vm:~$ head ~/nexus/rapport.txt
            (displays the first 10 lines)

            student@nexus-vm:~$ tail ~/nexus/rapport.txt
            (displays the last 10 lines)

            student@nexus-vm:~$ wc -l ~/nexus/rapport.txt
            42 /home/student/nexus/rapport.txt

        - type: terminal_exercise
          title: "Read the NEXUS Report"
          instructions: |
            In your VM, go to your home directory, then read the file
            `~/nexus/rapport.txt` using the following commands:

            1. `cat ~/nexus/rapport.txt`
            2. `head ~/nexus/rapport.txt`
            3. `tail ~/nexus/rapport.txt`
            4. `wc -l ~/nexus/rapport.txt`
          expectedCommands:
            - "cat ~/nexus/rapport.txt"
            - "head ~/nexus/rapport.txt"
            - "tail ~/nexus/rapport.txt"
            - "wc -l ~/nexus/rapport.txt"

        - type: questions
          items:
            - id: t9-q1
              type: qcm
              question: "Which command displays the complete contents of a file?"
              answers:
                - text: "cat"
                  correct: true
                - text: "pwd"
                  correct: false
                - text: "cd"
                  correct: false
                - text: "history"
                  correct: false

            - id: t9-q2
              type: qcm
              question: "You want to see only the last lines of a long file. Which command do you choose?"
              answers:
                - text: "head"
                  correct: false
                - text: "tail"
                  correct: true
                - text: "whoami"
                  correct: false
                - text: "clear"
                  correct: false

            - id: t9-q3
              type: short_answer
              question: "Write the command to count the number of lines in `rapport.txt`."
              acceptedAnswers:
                - "wc -l rapport.txt"
              trimWhitespace: true
              caseSensitive: false

            - id: t9-q4
              type: qcm
              question: "Why does this first module avoid commands like `rm` or `sudo`?"
              answers:
                - text: "Because this module focuses first on observation and reading without making changes."
                  correct: true
                - text: "Because these commands do not exist on Linux."
                  correct: false
                - text: "Because they only work on Windows."
                  correct: false
                - text: "Because they only display images."
                  correct: false

    # ── CHALLENGE ─────────────────────────────────────────────────────────────
    - id: linux-fund-1-en-challenge
      type: challenge
      title: "Challenge — First Contact"
      order: 10
      xpReward: 50
      penaltyEnabled: true
      recommendedVm: "linux-fund-1-challenge.ova"
      vmStatus: "To be created after final YAML validation."
      objectives:
        - "Use navigation and orientation commands."
        - "Find a hidden file without modifying the system."
        - "Read information and submit answers in NEXUS."
      sections:
        - type: mission
          title: "Mission Briefing"
          content: |
            Agent, your first real mission starts now.

            A training Linux machine has been prepared for you. It contains
            a few diagnostic files placed in the home directory of the
            `student` user.

            Your objective is to find the requested information using only
            the commands covered in this module.

            Authorized commands:

            - `whoami`
            - `pwd`
            - `clear`
            - `history`
            - `ls`
            - `ls -l`
            - `ls -a`
            - `ls -la`
            - `cd`
            - `cat`
            - `head`
            - `tail`
            - `wc -l`

        - type: warning
          title: "No System Modifications Allowed"
          content: |
            For this challenge, you must not create, modify, move, copy, or delete
            any files. The mission consists of exploration and reading only.

            Commands such as `rm`, `mv`, `cp`, `touch`, `mkdir`, `sudo`, `>`, and `>>`
            are not needed to complete this challenge.

        - type: theory
          title: "VM Access"
          content: |
            Download and launch the virtual machine provided by your teacher.

            Expected information:

            - VM: `linux-fund-1-challenge.ova`
            - Username: `student`
            - Password: `nexus2026`
            - Starting directory: `/home/student`

        - type: questions
          items:
            - id: c1
              type: short_answer
              question: "What username is displayed by the `whoami` command?"
              acceptedAnswers:
                - "student"
              trimWhitespace: true
              caseSensitive: false
              hints:
                - "The command to use sounds like a question in English."
                - "Type `whoami` in the terminal."

            - id: c2
              type: short_answer
              question: "What full path does `pwd` display at the start of the mission?"
              acceptedAnswers:
                - "/home/student"
                - "/home/student/"
              trimWhitespace: true
              caseSensitive: false
              hints:
                - "The `pwd` command displays your current location."
                - "You should be in the home directory of the student user."

            - id: c3
              type: short_answer
              question: "What is the full path of the hidden file `flag.txt`?"
              acceptedAnswers:
                - "/home/student/.nexus/flag.txt"
                - "/home/student/.nexus/flag.txt/"
              trimWhitespace: true
              caseSensitive: false
              hints:
                - "A hidden file or directory often starts with a dot."
                - "The `ls` command alone does not show everything."
                - "Try `ls -a` in `/home/student`."

            - id: c4
              type: short_answer
              question: "What is the content of the hidden file `flag.txt`?"
              acceptedAnswers:
                - "NEXUS-LINUX-FUND-1"
                - "nexus-linux-fund-1"
              trimWhitespace: true
              caseSensitive: false
              hints:
                - "Once you know the file path, use a reading command."
                - "The `cat` command can display the full contents of a small file."

            - id: c5
              type: short_answer
              question: "How many lines does the file `/home/student/nexus/rapport.txt` contain?"
              acceptedAnswers:
                - "42"
                - "42 /home/student/nexus/rapport.txt"
              trimWhitespace: true
              caseSensitive: false
              hints:
                - "The command you need counts lines."
                - "Use `wc -l /home/student/nexus/rapport.txt`."

            - id: c6
              type: short_answer
              question: "What complete command did you use to count the lines in the report?"
              acceptedAnswers:
                - "wc -l /home/student/nexus/rapport.txt"
                - "wc -l ~/nexus/rapport.txt"
                - "cd ~/nexus && wc -l rapport.txt"
              trimWhitespace: true
              caseSensitive: false
              hints:
                - "An absolute path starts with `/`."
                - "The shortcut `~` also represents `/home/student` for this user."

            - id: c7
              type: qcm
              question: "Which command would have been most useful to discover the `.nexus` folder?"
              answers:
                - text: "ls -a"
                  correct: true
                - text: "clear"
                  correct: false
                - text: "pwd"
                  correct: false
                - text: "whoami"
                  correct: false

            - id: c8
              type: qcm
              question: "In this mission, why should you avoid commands like `rm` or `sudo`?"
              answers:
                - text: "Because the mission only requires exploring and reading without modifying the system."
                  correct: true
                - text: "Because they are only used to display hidden files."
                  correct: false
                - text: "Because they replace the `pwd` command."
                  correct: false
                - text: "Because they are needed to read a text file."
                  correct: false

        - type: teacher_note
          title: "Suggested VM Content for the Challenge"
          content: |
            Prepare an Ubuntu 24.04 LTS VM with the student user.

            Suggested structure:

            /home/student/
            ├── nexus/
            │   └── rapport.txt           # 42-line file
            └── .nexus/
                └── flag.txt              # content: NEXUS-LINUX-FUND-1

            Ensure that students can succeed using only the commands from this module.
            Do not require `grep`, `find`, `cp`, `mv`, `rm`, `sudo`, `>`, or `>>`.
