          title: Suggested Challenge VM Setup
          content: |
            Prepare a VM or challenge directory with a structure such as:

            mission-incident/
            ├── logs/
            │   ├── system.log
            │   ├── auth.log
            │   └── app.log
            ├── clients/
            │   ├── client-a/notes.txt
            │   └── client-b/rapport.txt
            └── archives/
                └── old-system.log

            Insert a few lines containing a keyword such as `incident`, `intrusion`, `erreur`, or `nexus-alert`.
            Include files with mixed case, for example `rapport.TXT`, to reinforce the case-sensitivity concept.
