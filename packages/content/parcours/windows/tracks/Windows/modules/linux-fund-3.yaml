module:
  id: linux-fund-3
  trackId: linux
  title: "Linux Fundamentals 3"
  description: "Processes, services, system logs, basic networking, SSH, and package management"
  order: 3
  mascot: "tux-toolbox"
  xpReward: 50

  tasks:

    # ── TASK 1 ────────────────────────────────────────────────────────────────
    - id: linux-fund-3-t1
      type: task
      title: "Understanding Processes"
      order: 1
      xpReward: 10
      sections:
        - type: theory
          content: |
            ## What is a process?

            A **process** is any program that is currently running on your system.
            Every time you open a terminal, run a command, or start an application,
            Linux creates a new process.

            Each process has a unique **PID (Process ID)** — a number assigned by
            the kernel when the process starts.

            In IT support, monitoring processes is essential to answer questions like:
            - *"Why is my server running slow?"*
            - *"What program is using all my CPU?"*
            - *"Is the web server actually running?"*

        - type: command_table
          commands:
            - cmd: "ps"
              desc: "Show processes running in the current terminal session"
            - cmd: "ps aux"
              desc: "Show ALL processes running on the system with details"
            - cmd: "ps aux | grep apache"
              desc: "Filter process list to find a specific program"
            - cmd: "top"
              desc: "Live view of running processes (like Task Manager) — press q to quit"
            - cmd: "htop"
              desc: "Enhanced version of top with colors and mouse support"

        - type: code_block
          label: "ps aux output explained"
          content: |
            user@linux:~$ ps aux | head -5
            USER       PID %CPU %MEM    VSZ   RSS TTY  STAT START   TIME COMMAND
            root         1  0.0  0.1  22548  1234 ?    Ss   Jan10   0:02 /sbin/init
            root         2  0.0  0.0      0     0 ?    S    Jan10   0:00 [kthreadd]
            www-data   823  0.1  1.2  456789 12345 ?   S    Jan10   1:23 apache2
            student   1042  0.0  0.3  12345  3456 pts/0 Ss  09:00   0:00 bash

        - type: theory
          content: |
            ## Reading ps aux columns

            | Column | Meaning |
            |--------|---------|
            | USER   | Who is running the process |
            | PID    | Process ID (unique number) |
            | %CPU   | CPU usage percentage |
            | %MEM   | Memory usage percentage |
            | STAT   | Process state (S=sleeping, R=running, Z=zombie) |
            | COMMAND| The program being executed |

        - type: questions
          items:
            - id: q1
              type: qcm
              question: "What does PID stand for?"
              answers:
                - text: "Program Identifier"
                  correct: false
                - text: "Process ID"
                  correct: true
                - text: "Primary Input Device"
                  correct: false
                - text: "Processor Instance Data"
                  correct: false

            - id: q2
              type: short_answer
              question: "Write the command to see ALL processes running on the system with full details."
              answer: "ps aux"

            - id: q3
              type: qcm
              question: "You want to check if Apache is running. Which command is most efficient?"
              answers:
                - text: "top"
                  correct: false
                - text: "ps aux | grep apache"
                  correct: true
                - text: "ls /var/www"
                  correct: false
                - text: "cat /proc/apache"
                  correct: false

    # ── TASK 2 ────────────────────────────────────────────────────────────────
    - id: linux-fund-3-t2
      type: task
      title: "Managing Processes"
      order: 2
      xpReward: 10
      sections:
        - type: theory
          content: |
            ## Stopping and controlling processes

            Sometimes a process freezes, consumes too many resources, or
            needs to be stopped. Linux gives you several ways to do this.

        - type: command_table
          commands:
            - cmd: "kill PID"
              desc: "Send a termination signal to a process (graceful stop)"
            - cmd: "kill -9 PID"
              desc: "Force kill a process immediately (use when kill alone fails)"
            - cmd: "pkill processname"
              desc: "Kill a process by name instead of PID"
            - cmd: "killall processname"
              desc: "Kill all processes with that name"

        - type: code_block
          label: "Killing a process"
          content: |
            # Find the PID of the process
            user@linux:~$ ps aux | grep firefox
            student  4521  95.0  8.2  1234567 84000 ?  Rl  09:15  firefox

            # Graceful kill first
            user@linux:~$ kill 4521

            # If it doesn't respond, force kill
            user@linux:~$ kill -9 4521

            # Or kill by name
            user@linux:~$ pkill firefox

        - type: theory
          content: |
            ## Background and foreground processes

            Linux allows you to run processes in the **background** so your
            terminal stays free for other commands.

        - type: command_table
          commands:
            - cmd: "command &"
              desc: "Run a command in the background"
            - cmd: "jobs"
              desc: "List background jobs in the current session"
            - cmd: "fg %1"
              desc: "Bring job number 1 back to the foreground"
            - cmd: "Ctrl+C"
              desc: "Stop (interrupt) the currently running foreground process"
            - cmd: "Ctrl+Z"
              desc: "Pause (suspend) the currently running foreground process"

        - type: questions
          items:
            - id: q1
              type: short_answer
              question: "A process with PID 3821 is frozen and not responding to a normal kill. Write the force kill command."
              answer: "kill -9 3821"

            - id: q2
              type: qcm
              question: "What is the difference between 'kill PID' and 'kill -9 PID'?"
              answers:
                - text: "There is no difference"
                  correct: false
                - text: "kill sends a graceful stop signal, kill -9 forces immediate termination"
                  correct: true
                - text: "kill -9 is slower than kill"
                  correct: false
                - text: "kill only works for root processes"
                  correct: false

            - id: q3
              type: short_answer
              question: "Write the command to kill all processes named 'python3'."
              answer: "pkill python3"

    # ── TASK 3 ────────────────────────────────────────────────────────────────
    - id: linux-fund-3-t3
      type: task
      title: "Managing Services with systemctl"
      order: 3
      xpReward: 15
      sections:
        - type: theory
          content: |
            ## What is a service?

            A **service** (also called a *daemon*) is a process that runs
            continuously in the background to provide functionality:
            - `apache2` or `nginx` — web server
            - `ssh` — remote access
            - `mysql` — database
            - `cron` — scheduled tasks

            Services are managed by **systemd**, which is the init system
            used by Ubuntu and most modern Linux distributions.

            The command to interact with systemd is `systemctl`.

        - type: command_table
          commands:
            - cmd: "sudo systemctl start service"
              desc: "Start a service"
            - cmd: "sudo systemctl stop service"
              desc: "Stop a service"
            - cmd: "sudo systemctl restart service"
              desc: "Stop then start a service (apply config changes)"
            - cmd: "sudo systemctl reload service"
              desc: "Reload config without fully restarting (if supported)"
            - cmd: "systemctl status service"
              desc: "Check if a service is running and see recent logs"
            - cmd: "sudo systemctl enable service"
              desc: "Start service automatically at boot"
            - cmd: "sudo systemctl disable service"
              desc: "Prevent service from starting at boot"
            - cmd: "systemctl list-units --type=service"
              desc: "List all services and their status"

        - type: code_block
          label: "systemctl status output"
          content: |
            user@linux:~$ systemctl status apache2
            * apache2.service - The Apache HTTP Server
                 Loaded: loaded (/lib/systemd/system/apache2.service; enabled)
                 Active: active (running) since Mon 2024-01-10 09:00:00 UTC
               Main PID: 823 (apache2)
                  Tasks: 55 (limit: 4915)
                 Memory: 12.3M
                    CPU: 1.234s
                 CGroup: /system.slice/apache2.service
                         ├─823 /usr/sbin/apache2 -k start
            Jan 10 09:00:00 linux apache2[823]: AH00558: apache2: Could not
            Jan 10 09:00:00 linux systemd[1]: Started The Apache HTTP Server.

        - type: theory
          content: |
            ## Reading systemctl status

            The most important line is **Active:**

            | Status | Meaning |
            |--------|---------|
            | `active (running)` | Service is running normally |
            | `inactive (dead)` | Service is stopped |
            | `failed` | Service crashed or failed to start |
            | `activating` | Service is starting up |

            The **Loaded** line also tells you if the service is **enabled**
            (will start at boot) or **disabled**.

        - type: questions
          items:
            - id: q1
              type: short_answer
              question: "Write the command to check if the SSH service is running."
              answer: "systemctl status ssh"

            - id: q2
              type: qcm
              question: "A web server was updated and needs its configuration reloaded. Users are connected — you don't want to interrupt them. Which command is best?"
              answers:
                - text: "sudo systemctl restart apache2"
                  correct: false
                - text: "sudo systemctl stop apache2"
                  correct: false
                - text: "sudo systemctl reload apache2"
                  correct: true
                - text: "sudo systemctl start apache2"
                  correct: false

            - id: q3
              type: short_answer
              question: "Write the command to make the service 'mysql' start automatically every time the server boots."
              answer: "sudo systemctl enable mysql"

            - id: q4
              type: qcm
              question: "systemctl status nginx shows 'failed'. What does this mean?"
              answers:
                - text: "nginx is running but slow"
                  correct: false
                - text: "nginx crashed or failed to start"
                  correct: true
                - text: "nginx is disabled at boot"
                  correct: false
                - text: "nginx is not installed"
                  correct: false

    # ── TASK 4 ────────────────────────────────────────────────────────────────
    - id: linux-fund-3-t4
      type: task
      title: "Reading System Logs"
      order: 4
      xpReward: 15
      sections:
        - type: theory
          content: |
            ## Why logs matter in IT support

            **Logs are your best friend** when diagnosing problems. Every time
            something happens on a Linux system — a service starts, a user logs in,
            an error occurs — it gets recorded in a log file.

            As an IT support technician, reading logs is how you find out:
            - *Why did the service fail?*
            - *Who logged in at 3am?*
            - *What error is causing the crash?*

        - type: theory
          content: |
            ## Important log locations

            | Log file | Contents |
            |----------|----------|
            | `/var/log/syslog` | General system messages |
            | `/var/log/auth.log` | Authentication attempts (logins, sudo) |
            | `/var/log/kern.log` | Kernel messages (hardware, drivers) |
            | `/var/log/apache2/error.log` | Apache web server errors |
            | `/var/log/mysql/error.log` | MySQL database errors |

        - type: command_table
          commands:
            - cmd: "journalctl"
              desc: "View systemd journal (all system logs)"
            - cmd: "journalctl -u servicename"
              desc: "View logs for a specific service"
            - cmd: "journalctl -f"
              desc: "Follow logs in real time (like tail -f)"
            - cmd: "journalctl --since '1 hour ago'"
              desc: "View logs from the last hour"
            - cmd: "tail -f /var/log/syslog"
              desc: "Follow a log file in real time"
            - cmd: "grep 'error' /var/log/syslog"
              desc: "Search for errors in the system log"

        - type: code_block
          label: "Reading logs to diagnose a problem"
          content: |
            # Service failed — check its logs
            user@linux:~$ journalctl -u apache2 --since '10 minutes ago'
            Jan 10 09:15:32 linux apache2[1234]: AH00526: Syntax error on line 45
            Jan 10 09:15:32 linux apache2[1234]: Invalid command 'ServerNaem'
            Jan 10 09:15:32 linux systemd[1]: apache2.service: Control process exited
            Jan 10 09:15:32 linux systemd[1]: Failed to start The Apache HTTP Server.

            # Found the problem: typo 'ServerNaem' instead of 'ServerName' on line 45

        - type: questions
          items:
            - id: q1
              type: short_answer
              question: "Write the command to view the logs of the 'ssh' service using journalctl."
              answer: "journalctl -u ssh"

            - id: q2
              type: qcm
              question: "You want to monitor a log file in real time as new entries are added. Which command do you use?"
              answers:
                - text: "cat /var/log/syslog"
                  correct: false
                - text: "head /var/log/syslog"
                  correct: false
                - text: "tail -f /var/log/syslog"
                  correct: true
                - text: "grep /var/log/syslog"
                  correct: false

            - id: q3
              type: qcm
              question: "A user reports their login failed. Which log file would you check first?"
              answers:
                - text: "/var/log/syslog"
                  correct: false
                - text: "/var/log/auth.log"
                  correct: true
                - text: "/var/log/kern.log"
                  correct: false
                - text: "/var/log/apache2/error.log"
                  correct: false

            - id: q4
              type: short_answer
              question: "Write the command to search for the word 'failed' in the auth log file."
              answer: "grep failed /var/log/auth.log"

    # ── TASK 5 ────────────────────────────────────────────────────────────────
    - id: linux-fund-3-t5
      type: task
      title: "Basic Networking Commands"
      order: 5
      xpReward: 15
      sections:
        - type: theory
          content: |
            ## Network diagnostics in IT support

            Network issues are one of the most common support tickets:
            *"I can't connect to the internet"*, *"The server is unreachable"*,
            *"The website is down"*.

            Linux has powerful built-in tools to diagnose network problems
            from the command line.

        - type: command_table
          commands:
            - cmd: "ip a"
              desc: "Show all network interfaces and their IP addresses"
            - cmd: "ip r"
              desc: "Show the routing table (how traffic is directed)"
            - cmd: "ping hostname"
              desc: "Test connectivity to a host (press Ctrl+C to stop)"
            - cmd: "ping -c 4 hostname"
              desc: "Send exactly 4 ping packets then stop"
            - cmd: "ss -tulnp"
              desc: "Show all open ports and listening services"
            - cmd: "curl ifconfig.me"
              desc: "Show your public IP address"
            - cmd: "nslookup domain"
              desc: "Query DNS to resolve a domain name to IP"

        - type: code_block
          label: "ip a output — reading your IP address"
          content: |
            user@linux:~$ ip a
            1: lo: <LOOPBACK,UP> mtu 65536
                inet 127.0.0.1/8 scope host lo
            2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500
                inet 192.168.1.100/24 brd 192.168.1.255 scope global eth0
                inet6 fe80::1/64 scope link

            # Your IP address: 192.168.1.100
            # Subnet mask: /24 (255.255.255.0)
            # Network interface: eth0

        - type: code_block
          label: "Diagnosing a network problem step by step"
          content: |
            # Step 1 — Do I have an IP address?
            user@linux:~$ ip a | grep inet
            inet 192.168.1.100/24   <- Yes, I have an IP

            # Step 2 — Can I reach my gateway?
            user@linux:~$ ping -c 4 192.168.1.1
            64 bytes from 192.168.1.1: icmp_seq=1 ttl=64 time=1.23 ms
            # Gateway responds — local network is fine

            # Step 3 — Can I reach the internet?
            user@linux:~$ ping -c 4 8.8.8.8
            64 bytes from 8.8.8.8: icmp_seq=1 ttl=117 time=12.3 ms
            # Internet responds — connection is fine

            # Step 4 — Does DNS work?
            user@linux:~$ nslookup google.com
            Name: google.com
            Address: 142.250.80.46
            # DNS resolves — everything works

        - type: questions
          items:
            - id: q1
              type: short_answer
              question: "Write the command to display all network interfaces and their IP addresses."
              answer: "ip a"

            - id: q2
              type: short_answer
              question: "Write the command to test connectivity to 'google.com' with exactly 3 packets."
              answer: "ping -c 3 google.com"

            - id: q3
              type: qcm
              question: "A server is not accessible from the network. What is the FIRST command you run to check its network configuration?"
              answers:
                - text: "ping google.com"
                  correct: false
                - text: "ip a"
                  correct: true
                - text: "nslookup server"
                  correct: false
                - text: "ss -tulnp"
                  correct: false

            - id: q4
              type: qcm
              question: "You want to know which ports are open and listening on your server. Which command do you use?"
              answers:
                - text: "ip a"
                  correct: false
                - text: "ping localhost"
                  correct: false
                - text: "ss -tulnp"
                  correct: true
                - text: "top"
                  correct: false

    # ── TASK 6 ────────────────────────────────────────────────────────────────
    - id: linux-fund-3-t6
      type: task
      title: "Remote Access with SSH"
      order: 6
      xpReward: 15
      sections:
        - type: theory
          content: |
            ## What is SSH?

            **SSH (Secure Shell)** is a protocol that allows you to connect to
            and control a remote Linux computer securely over a network.

            In IT support, SSH is used every day to:
            - Manage servers remotely without being physically present
            - Transfer files between systems
            - Run commands on remote machines

            SSH encrypts everything — your password, your commands, the output —
            so nobody can intercept your session.

        - type: command_table
          commands:
            - cmd: "ssh user@hostname"
              desc: "Connect to a remote server as 'user'"
            - cmd: "ssh user@192.168.1.100"
              desc: "Connect using IP address instead of hostname"
            - cmd: "ssh -p 2222 user@hostname"
              desc: "Connect on a non-standard port (default is 22)"
            - cmd: "exit"
              desc: "Disconnect from an SSH session"
            - cmd: "scp file user@host:/path/"
              desc: "Securely copy a file to a remote server"
            - cmd: "scp user@host:/path/file ."
              desc: "Download a file from a remote server to current directory"

        - type: code_block
          label: "Connecting via SSH"
          content: |
            # Connect to a remote server
            user@linux:~$ ssh admin@192.168.1.50
            The authenticity of host '192.168.1.50' can't be established.
            ECDSA key fingerprint is SHA256:abc123...
            Are you sure you want to continue connecting? yes
            Warning: Permanently added '192.168.1.50' to known hosts.
            admin@192.168.1.50's password: ****

            # Now you are on the remote machine
            admin@server50:~$ hostname
            server50
            admin@server50:~$ exit
            Connection to 192.168.1.50 closed.

            # Back on local machine
            user@linux:~$

        - type: theory
          content: |
            ## SSH service management

            For a server to accept SSH connections, the **SSH service must be
            running** on that server. The service is called `ssh` or `sshd`
            (SSH Daemon).

        - type: code_block
          label: "Managing the SSH service"
          content: |
            # Check if SSH is running
            user@linux:~$ systemctl status ssh
            * ssh.service - OpenBSD Secure Shell server
                 Active: active (running)

            # If not running, start it
            user@linux:~$ sudo systemctl start ssh

            # Make sure it starts on boot
            user@linux:~$ sudo systemctl enable ssh

        - type: questions
          items:
            - id: q1
              type: short_answer
              question: "Write the SSH command to connect to the server at 10.0.0.5 as user 'sysadmin'."
              answer: "ssh sysadmin@10.0.0.5"

            - id: q2
              type: qcm
              question: "What port does SSH use by default?"
              answers:
                - text: "80"
                  correct: false
                - text: "443"
                  correct: false
                - text: "22"
                  correct: true
                - text: "8080"
                  correct: false

            - id: q3
              type: short_answer
              question: "Write the command to copy the local file 'report.txt' to the directory '/home/admin/' on server 192.168.1.10 as user 'admin'."
              answer: "scp report.txt admin@192.168.1.10:/home/admin/"

            - id: q4
              type: qcm
              question: "You try to SSH into a server but get 'Connection refused'. What is the most likely cause?"
              answers:
                - text: "Your password is wrong"
                  correct: false
                - text: "The SSH service is not running on the remote server"
                  correct: true
                - text: "SSH is not installed on your computer"
                  correct: false
                - text: "The server is too far away"
                  correct: false

    # ── TASK 7 ────────────────────────────────────────────────────────────────
    - id: linux-fund-3-t7
      type: task
      title: "Package Management with apt"
      order: 7
      xpReward: 10
      sections:
        - type: theory
          content: |
            ## What is a package manager?

            In Linux, software is distributed in **packages** — bundles that
            contain a program and everything it needs to run.

            Ubuntu uses **APT (Advanced Package Tool)** to manage software.
            APT handles:
            - Downloading software from official repositories
            - Installing dependencies automatically
            - Updating all installed software
            - Removing software cleanly

            This is different from Windows where you manually download `.exe` files
            from websites. With APT, everything comes from trusted, verified sources.

        - type: command_table
          commands:
            - cmd: "sudo apt update"
              desc: "Refresh the list of available packages (always run first)"
            - cmd: "sudo apt upgrade"
              desc: "Upgrade all installed packages to latest versions"
            - cmd: "sudo apt install packagename"
              desc: "Install a new package"
            - cmd: "sudo apt remove packagename"
              desc: "Remove a package (keep config files)"
            - cmd: "sudo apt purge packagename"
              desc: "Remove a package and delete its config files"
            - cmd: "apt search keyword"
              desc: "Search for packages by keyword"
            - cmd: "apt show packagename"
              desc: "Show details about a package"
            - cmd: "dpkg -l"
              desc: "List all installed packages"

        - type: code_block
          label: "Installing and managing software with apt"
          content: |
            # Always update package list first
            user@linux:~$ sudo apt update
            Hit:1 http://archive.ubuntu.com/ubuntu noble InRelease
            Reading package lists... Done
            8 packages can be upgraded.

            # Install a package
            user@linux:~$ sudo apt install htop
            Reading package lists... Done
            The following packages will be installed: htop
            Do you want to continue? [Y/n] y
            Setting up htop (3.2.2-1) ...

            # Search for a package
            user@linux:~$ apt search network scanner
            nmap/noble 7.94+dfsg1-2 amd64
              The Network Mapper

            # Remove a package completely
            user@linux:~$ sudo apt purge htop
            Removing htop (3.2.2-1) ...

        - type: questions
          items:
            - id: q1
              type: short_answer
              question: "Before installing any package, what command should you always run first?"
              answer: "sudo apt update"

            - id: q2
              type: short_answer
              question: "Write the command to install the package 'nmap'."
              answer: "sudo apt install nmap"

            - id: q3
              type: qcm
              question: "What is the difference between 'apt remove' and 'apt purge'?"
              answers:
                - text: "There is no difference"
                  correct: false
                - text: "remove keeps configuration files, purge removes everything including config"
                  correct: true
                - text: "purge only works for system packages"
                  correct: false
                - text: "remove is faster than purge"
                  correct: false

            - id: q4
              type: short_answer
              question: "Write the command to upgrade all installed packages to their latest versions."
              answer: "sudo apt upgrade"

    # ── TASK 8 ────────────────────────────────────────────────────────────────
    - id: linux-fund-3-t8
      type: task
      title: "Practical Scenario — Server Down!"
      order: 8
      xpReward: 15
      sections:
        - type: theory
          content: |
            ## The complete support workflow

            You receive a ticket:

            > *"Our web server stopped responding after the weekend.
            > The website is down and we don't know why.
            > Can you fix it urgently?"*

            This is a classic IT support scenario that combines everything
            you have learned in Linux Fundamentals 1, 2, and 3.
            Let's work through it systematically.

        - type: theory
          content: |
            ## Step 1 — Connect remotely via SSH

        - type: code_block
          label: "Connect to the server"
          content: |
            # Connect to the server remotely
            user@linux:~$ ssh admin@webserver-01
            admin@webserver-01:~$

        - type: theory
          content: |
            ## Step 2 — Check if the web service is running

        - type: code_block
          label: "Check service status"
          content: |
            admin@webserver-01:~$ systemctl status apache2
            * apache2.service - The Apache HTTP Server
                 Active: failed (Result: exit-code)
            Jan 13 09:00:12 webserver-01 systemd[1]: Failed to start Apache.

            # Service is failed — check the logs to find out why

        - type: theory
          content: |
            ## Step 3 — Read the logs

        - type: code_block
          label: "Diagnose with logs"
          content: |
            admin@webserver-01:~$ journalctl -u apache2 --since '2 days ago'
            Jan 11 23:58:01 webserver-01 apache2[1234]: AH00558: Could not open
            Jan 11 23:58:01 webserver-01 apache2[1234]: /var/www/html/index.php
            Jan 11 23:58:01 webserver-01 apache2[1234]: Permission denied

            # Found it! Apache can't read the web files — permission issue

        - type: theory
          content: |
            ## Step 4 — Fix the permissions

        - type: code_block
          label: "Fix and verify"
          content: |
            # Check current permissions
            admin@webserver-01:~$ ls -la /var/www/html/
            -rw------- 1 root root 12345 Jan 11 index.php
            # Problem: only root can read, Apache (www-data) cannot

            # Fix ownership
            admin@webserver-01:~$ sudo chown -R www-data:www-data /var/www/html/

            # Restart the service
            admin@webserver-01:~$ sudo systemctl restart apache2

            # Verify it's running
            admin@webserver-01:~$ systemctl status apache2
            Active: active (running)

            # Test connectivity
            admin@webserver-01:~$ curl -I http://localhost
            HTTP/1.1 200 OK
            # Website is back online!

        - type: questions
          items:
            - id: q1
              type: qcm
              question: "In what order should you diagnose a 'service down' issue?"
              answers:
                - text: "Fix permissions first, then check logs, then restart"
                  correct: false
                - text: "Restart the service, check status, read logs if still failing"
                  correct: false
                - text: "Check status, read logs to find the cause, fix the cause, restart"
                  correct: true
                - text: "Reinstall the service immediately"
                  correct: false

            - id: q2
              type: short_answer
              question: "Write the command to check the Apache service logs from the last 30 minutes."
              answer: "journalctl -u apache2 --since '30 minutes ago'"

            - id: q3
              type: short_answer
              question: "Write the single command that fixes ownership of all web files for Apache (user and group: www-data, directory: /var/www/html/)."
              answer: "sudo chown -R www-data:www-data /var/www/html/"

            - id: q4
              type: qcm
              question: "After fixing a service issue, what should you always do to confirm the fix worked?"
              answers:
                - text: "Reboot the entire server"
                  correct: false
                - text: "Run systemctl status to verify the service is active (running)"
                  correct: true
                - text: "Wait 24 hours and see if users complain again"
                  correct: false
                - text: "Delete the log files"
                  correct: false

