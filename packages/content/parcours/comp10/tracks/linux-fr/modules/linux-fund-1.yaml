module:
  id: linux-fund-1
  trackId: linux
  title: "Linux Fundamentals 1"
  description: "Histoire de Linux, premier contact avec le terminal, commandes de base"
  order: 1
  mascot: "tux-filesystem"
  xpReward: 50

  tasks:

    # ── TASK 1 ────────────────────────────────────────────────────────────────
    - id: linux-fund-1-t1
      type: task
      title: "What is Linux?"
      order: 1
      xpReward: 10
      sections:
        - type: theory
          content: |
            Linux is an **open-source operating system** — a piece of software that manages
            your computer's hardware and allows programs to run.

            Unlike Windows or macOS, Linux was created collaboratively by developers around
            the world and is **free to use, modify, and distribute**.

            Linux was first created in **1991** by a Finnish student named **Linus Torvalds**.
            He started it as a personal project and shared the source code online. Thousands
            of developers joined in, and Linux became one of the most important software
            projects in history.

            Today, Linux powers:
            - Most of the world's web servers
            - Android smartphones
            - Supercomputers
            - Cloud infrastructure (AWS, Google Cloud, Azure)
            - Embedded systems (routers, TVs, cars)

        - type: questions
          items:
            - id: q1
              type: qcm
              question: "Who created the Linux kernel?"
              answers:
                - text: "Bill Gates"
                  correct: false
                - text: "Linus Torvalds"
                  correct: true
                - text: "Richard Stallman"
                  correct: false
                - text: "Steve Jobs"
                  correct: false

            - id: q2
              type: qcm
              question: "In what year was Linux first released?"
              answers:
                - text: "1985"
                  correct: false
                - text: "1999"
                  correct: false
                - text: "1991"
                  correct: true
                - text: "2001"
                  correct: false

            - id: q3
              type: qcm
              question: "Which of these devices runs Linux?"
              answers:
                - text: "iPhone"
                  correct: false
                - text: "Android smartphone"
                  correct: true
                - text: "Xbox"
                  correct: false
                - text: "Nintendo Switch"
                  correct: false

    # ── TASK 2 ────────────────────────────────────────────────────────────────
    - id: linux-fund-1-t2
      type: task
      title: "Linux Distributions"
      order: 2
      xpReward: 10
      sections:
        - type: theory
          content: |
            The Linux **kernel** (core) is the same for everyone, but different organizations
            package it differently. These packaged versions are called **distributions** (or "distros").

            Think of it like this: the engine is Linux, but different car manufacturers build
            different vehicles around it.

        - type: command_table
          commands:
            - cmd: "Ubuntu"
              desc: "Most popular for beginners. Used in this course."
            - cmd: "Debian"
              desc: "Very stable, widely used on servers"
            - cmd: "Kali Linux"
              desc: "Specialized for cybersecurity and penetration testing"
            - cmd: "Red Hat / CentOS"
              desc: "Enterprise-focused, used in corporations"
            - cmd: "Arch Linux"
              desc: "Minimal, for advanced users who build their own system"

        - type: theory
          content: |
            In this course, we use **Ubuntu 24.04 LTS**.
            **LTS** stands for *Long Term Support* — it means Ubuntu will receive security
            updates for 5 years, making it reliable for learning and production use.

        - type: questions
          items:
            - id: q1
              type: qcm
              question: "What does 'distro' refer to in Linux?"
              answers:
                - text: "A type of Linux virus"
                  correct: false
                - text: "A packaged version of Linux"
                  correct: true
                - text: "A Linux command"
                  correct: false
                - text: "A Linux file format"
                  correct: false

            - id: q2
              type: qcm
              question: "Which Linux distribution is specialized for cybersecurity?"
              answers:
                - text: "Ubuntu"
                  correct: false
                - text: "Arch Linux"
                  correct: false
                - text: "Kali Linux"
                  correct: true
                - text: "Debian"
                  correct: false

            - id: q3
              type: qcm
              question: "What does LTS stand for?"
              answers:
                - text: "Linux Terminal System"
                  correct: false
                - text: "Latest Technology Support"
                  correct: false
                - text: "Long Term Support"
                  correct: true
                - text: "Linux Transfer Standard"
                  correct: false

    # ── TASK 3 ────────────────────────────────────────────────────────────────
    - id: linux-fund-1-t3
      type: task
      title: "The Terminal"
      order: 3
      xpReward: 10
      sections:
        - type: theory
          content: |
            The **terminal** (also called the *command line* or *shell*) is a text-based
            interface to interact with your Linux system.

            Instead of clicking on icons, you **type commands** and press Enter.
            The system executes them and shows you the result.

            This might seem old-fashioned, but it is actually much more **powerful and
            precise** than a graphical interface. Every professional system administrator
            and cybersecurity expert uses the terminal daily.

        - type: code_block
          label: "This is what a terminal looks like"
          content: |
            user@linux:~$ enter commands here

        - type: theory
          content: |
            Let's break down what you see on the prompt line:

            - **user** → your username (who you are logged in as)
            - **@linux** → the name of the machine (hostname)
            - `~` → your current location (`~` means your home directory)
            - **$** → indicates you are a regular user (# would mean root/admin)

        - type: questions
          items:
            - id: q1
              type: qcm
              question: "What symbol indicates you are logged in as a regular user?" 
              answers:
                - text: "#"
                  correct: false
                - text: "@"
                  correct: false
                - text: "$"
                  correct: true
                - text: "`~`"
                  correct: false

            - id: q2
              type: qcm
              question: "What does the tilde symbol `~` represent in the terminal prompt?"
              answers:
                - text: "The root directory"
                  correct: false
                - text: "Your home directory"
                  correct: true
                - text: "A hidden folder"
                  correct: false
                - text: "The system directory"
                  correct: false

    # ── TASK 4 ────────────────────────────────────────────────────────────────
    - id: linux-fund-1-t4
      type: task
      title: "Your First Commands"
      order: 4
      xpReward: 15
      sections:
        - type: theory
          content: |
            Let's run your very first Linux commands. We will start with two simple ones
            that every Linux user needs to know.

        - type: command_table
          commands:
            - cmd: "echo"
              desc: "Outputs (prints) any text you provide"
            - cmd: "whoami"
              desc: "Displays the username you are currently logged in as"

        - type: code_block
          label: "Using echo"
          content: |
            user@linux:~$ echo Hello
            Hello
            user@linux:~$ echo "Hello World!"
            Hello World!

        - type: theory
          content: |
            **Important rule:** If your text contains **spaces**, wrap it in double quotes.
            - `echo Hello` → works fine (single word)
            - `echo Hello World` → may not work as expected
            - `echo "Hello World"` → correct way with spaces

        - type: code_block
          label: "Using whoami"
          content: |
            user@linux:~$ whoami
            student

        - type: questions
          items:
            - id: q1
              type: qcm
              question: "What command would you use to display the text 'TryHackMe'?"
              answers:
                - text: "print TryHackMe"
                  correct: false
                - text: "echo TryHackMe"
                  correct: true
                - text: "display TryHackMe"
                  correct: false
                - text: "show TryHackMe"
                  correct: false

            - id: q2
              type: short_answer
              question: "What command shows your current username?"
              answer: "whoami"

            - id: q3
              type: short_answer
              question: "Write the command to display the text: Hello Linux!"
              answer: "echo \"Hello Linux!\""

    # ── TASK 5 ────────────────────────────────────────────────────────────────
    - id: linux-fund-1-t5
      type: task
      title: "Navigating the Filesystem"
      order: 5
      xpReward: 15
      sections:
        - type: theory
          content: |
            The Linux filesystem is organized as a **tree structure**, starting from a
            single root directory called `/` (pronounced "slash" or "root").

            Everything in Linux — files, programs, settings — lives somewhere in this tree.

        - type: command_table
          commands:
            - cmd: "pwd"
              desc: "Print Working Directory — shows where you currently are"
            - cmd: "ls"
              desc: "List — shows files and folders in the current directory"
            - cmd: "cd [directory]"
              desc: "Change Directory — moves you to another location"

        - type: code_block
          label: "Navigating directories"
          content: |
            user@linux:~$ pwd
            /home/student
            user@linux:~$ ls
            Desktop  Documents  Downloads  Pictures
            user@linux:~$ cd Documents
            user@linux:~/Documents$ pwd
            /home/student/Documents

        - type: theory
          content: |
            **Two special shortcuts:**
            - `cd ..` → go **up** one level (to the parent directory)
            - `cd ~` → go back to your **home directory** from anywhere

        - type: code_block
          label: "Going up and home"
          content: |
            user@linux:~/Documents$ cd ..
            user@linux:~$ cd /var/log
            user@linux:/var/log$ cd ~
            user@linux:~$

        - type: questions
          items:
            - id: q1
              type: qcm
              question: "What command shows your current location in the filesystem?"
              answers:
                - text: "ls"
                  correct: false
                - text: "cd"
                  correct: false
                - text: "pwd"
                  correct: true
                - text: "dir"
                  correct: false

            - id: q2
              type: short_answer
              question: "What is the root directory of the Linux filesystem called?"
              answer: "/"

            - id: q3
              type: short_answer
              question: "Write the command to go up one directory level."
              answer: "cd .."

            - id: q4
              type: qcm
              question: "You are in /home/student/Documents. You type 'cd ..'. Where are you now?"
              answers:
                - text: "/home"
                  correct: false
                - text: "/home/student"
                  correct: true
                - text: "/"
                  correct: false
                - text: "/home/student/Documents/cd"
                  correct: false

    # ── TASK 6 ────────────────────────────────────────────────────────────────
    - id: linux-fund-1-t6
      type: task
      title: "Reading Files"
      order: 6
      xpReward: 15
      sections:
        - type: theory
          content: |
            Now that you can navigate the filesystem, let's learn how to **read the
            content of files** directly in the terminal — no need to open a text editor.

        - type: command_table
          commands:
            - cmd: "cat [file]"
              desc: "Displays the full content of a file"
            - cmd: "head [file]"
              desc: "Shows the first 10 lines of a file"
            - cmd: "tail [file]"
              desc: "Shows the last 10 lines of a file"
            - cmd: "wc -l [file]"
              desc: "Counts the number of lines in a file"

        - type: code_block
          label: "Reading a file with cat"
          content: |
            user@linux:~$ cat /etc/hostname
            linux-machine
            user@linux:~$ cat /etc/os-release
            PRETTY_NAME="Ubuntu 24.04 LTS"
            NAME="Ubuntu"
            VERSION="24.04 LTS (Noble Numbat)"

        - type: code_block
          label: "Using head and tail"
          content: |
            user@linux:~$ head /var/log/syslog
            (first 10 lines of the system log)
            user@linux:~$ tail /var/log/syslog
            (last 10 lines of the system log)

        - type: questions
          items:
            - id: q1
              type: qcm
              question: "Which command displays the complete content of a file?"
              answers:
                - text: "read"
                  correct: false
                - text: "open"
                  correct: false
                - text: "cat"
                  correct: true
                - text: "show"
                  correct: false

            - id: q2
              type: short_answer
              question: "Write the command to display the content of a file named 'notes.txt'."
              answer: "cat notes.txt"

            - id: q3
              type: qcm
              question: "You have a log file with 500 lines. You only want to see the most recent entries. Which command do you use?"
              answers:
                - text: "head logfile.txt"
                  correct: false
                - text: "cat logfile.txt"
                  correct: false
                - text: "tail logfile.txt"
                  correct: true
                - text: "wc -l logfile.txt"
                  correct: false

    # ── TASK 7 ────────────────────────────────────────────────────────────────
    - id: linux-fund-1-t7
      type: task
      title: "Creating Files and Directories"
      order: 7
      xpReward: 15
      sections:
        - type: theory
          content: |
            Let's learn how to **create** things — files and folders — directly from
            the terminal.

        - type: command_table
          commands:
            - cmd: "mkdir [name]"
              desc: "Make Directory — creates a new folder"
            - cmd: "touch [name]"
              desc: "Creates a new empty file (or updates timestamp if it exists)"
            - cmd: "rm [file]"
              desc: "Remove — permanently deletes a file"
            - cmd: "rm -r [directory]"
              desc: "Removes a directory and all its contents (use with caution!)"
            - cmd: "mv [source] [destination]"
              desc: "Moves or renames a file or directory"
            - cmd: "cp [source] [destination]"
              desc: "Copies a file or directory"

        - type: code_block
          label: "Creating files and folders"
          content: |
            user@linux:~$ mkdir projects
            user@linux:~$ ls
            Desktop  Documents  Downloads  projects
            user@linux:~$ touch projects/readme.txt
            user@linux:~$ ls projects/
            readme.txt

        - type: code_block
          label: "Moving and copying"
          content: |
            user@linux:~$ cp projects/readme.txt Documents/
            user@linux:~$ mv projects/readme.txt projects/README.txt
            user@linux:~$ ls projects/
            README.txt

        - type: theory
          content: |
            ⚠️ **Warning:** The `rm` command is **permanent**. There is no Recycle Bin
            in Linux. Once you delete a file with `rm`, it is gone forever.
            Always double-check before using `rm -r`.

        - type: questions
          items:
            - id: q1
              type: short_answer
              question: "Write the command to create a directory named 'backups'."
              answer: "mkdir backups"

            - id: q2
              type: short_answer
              question: "Write the command to create an empty file named 'config.txt'."
              answer: "touch config.txt"

            - id: q3
              type: qcm
              question: "What is the risk of using the 'rm' command?"
              answers:
                - text: "It moves files to the Recycle Bin"
                  correct: false
                - text: "It permanently deletes files with no recovery"
                  correct: true
                - text: "It only works on empty directories"
                  correct: false
                - text: "It requires administrator privileges"
                  correct: false

            - id: q4
              type: short_answer
              question: "Write the command to copy a file named 'data.txt' to the directory '/tmp/'."
              answer: "cp data.txt /tmp/"

    # ── TASK 8 ────────────────────────────────────────────────────────────────
    - id: linux-fund-1-t8
      type: task
      title: "Shell Operators"
      order: 8
      xpReward: 15
      sections:
        - type: theory
          content: |
            Shell operators let you **chain commands together** or **redirect output**
            to files. This is where the terminal starts to become truly powerful.

        - type: command_table
          commands:
            - cmd: ">"
              desc: "Redirect output to a file (overwrites existing content)"
            - cmd: ">>"
              desc: "Append output to a file (adds to existing content)"
            - cmd: "|"
              desc: "Pipe — sends output of one command as input to another"
            - cmd: "&&"
              desc: "Run second command only if first succeeded"

        - type: code_block
          label: "Using > and >>"
          content: |
            user@linux:~$ echo "Hello World" > greeting.txt
            user@linux:~$ cat greeting.txt
            Hello World
            user@linux:~$ echo "How are you?" >> greeting.txt
            user@linux:~$ cat greeting.txt
            Hello World
            How are you?

        - type: theory
          content: |
            Notice the difference:
            - `>` **overwrites** the file completely each time
            - `>>` **adds** to the end of the file without deleting existing content

        - type: code_block
          label: "Using the pipe |"
          content: |
            user@linux:~$ ls /etc | wc -l
            247
            user@linux:~$ cat /etc/passwd | grep student
            student:x:1000:1000::/home/student:/bin/bash

        - type: questions
          items:
            - id: q1
              type: qcm
              question: "What is the difference between > and >>?"
              answers:
                - text: "> appends, >> overwrites"
                  correct: false
                - text: "> overwrites, >> appends"
                  correct: true
                - text: "They do the same thing"
                  correct: false
                - text: "> creates files, >> deletes files"
                  correct: false

            - id: q2
              type: short_answer
              question: "Write the command to write 'Hello Linux!' into a file named 'test.txt' (create or overwrite)."
              answer: "echo \"Hello Linux!\" > test.txt"

            - id: q3
              type: short_answer
              question: "Write the command to ADD the line 'Second line' to the existing file 'test.txt' without deleting its content."
              answer: "echo \"Second line\" >> test.txt"

            - id: q4
              type: qcm
              question: "What does the | operator do?"
              answers:
                - text: "Deletes the output of a command"
                  correct: false
                - text: "Saves the output to a file"
                  correct: false
                - text: "Sends the output of one command as input to another"
                  correct: true
                - text: "Runs two commands at the same time"
                  correct: false

            - id: q5
              type: short_answer
              question: "Write a command that lists all files in /etc and counts how many there are."
              answer: "ls /etc | wc -l"

    # ── CHALLENGE ─────────────────────────────────────────────────────────────
    - id: linux-fund-1-challenge
      type: challenge
      title: "Challenge — First Contact"
      order: 9
      xpReward: 50
