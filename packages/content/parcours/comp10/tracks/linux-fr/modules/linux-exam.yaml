module:
  id: linux-exam
  trackId: linux
  title: "Linux Fundamentals — Final Exam"
  description: "Comprehensive assessment covering Linux Fundamentals 1, 2, and 3"
  order: 4
  mascot: "tux-toolbox"
  xpReward: 100

  tasks:

    # ── SECTION 1 — THÉORIE ───────────────────────────────────────────────────
    - id: linux-exam-t1
      type: task
      title: "Section 1 — Theory Review"
      order: 1
      xpReward: 20
      sections:
        - type: theory
          content: |
            ## Instructions

            This exam covers everything you have learned in Linux Fundamentals 1, 2, and 3.

            The exam has **three sections:**

            | Section | Format | Time | Points |
            |---------|--------|------|--------|
            | Section 1 | Theory questions in NEXUS | ~20 min | 20 XP |
            | Section 2 | Hands-on VM practice | ~1h30 | 30 XP |
            | Section 3 | Written report in English | ~1h | 50 XP |

            **Read all instructions carefully before starting.**

            Your teacher will provide the VM download link when Section 2 begins.

            **Good luck, Agent.**

        - type: questions
          items:
            - id: q1
              type: qcm
              question: "What command shows your current location in the Linux filesystem?"
              answers:
                - text: "ls"
                  correct: false
                - text: "pwd"
                  correct: true
                - text: "cd"
                  correct: false
                - text: "whoami"
                  correct: false

            - id: q2
              type: qcm
              question: "In the permission string '-rwxr-xr--', what permissions does the GROUP have?"
              answers:
                - text: "rwx — read, write, execute"
                  correct: false
                - text: "r-- — read only"
                  correct: false
                - text: "r-x — read and execute"
                  correct: true
                - text: "--- — no permissions"
                  correct: false

            - id: q3
              type: short_answer
              question: "What command do you use to display ALL running processes on the system?"
              answer: "ps aux"

            - id: q4
              type: qcm
              question: "A user gets 'Permission denied' when trying to run a script. What is the most likely cause?"
              answers:
                - text: "The script has a syntax error"
                  correct: false
                - text: "The script is missing execute permission"
                  correct: true
                - text: "The user is not connected to the internet"
                  correct: false
                - text: "The script file is too large"
                  correct: false

            - id: q5
              type: short_answer
              question: "What command installs a package named 'curl' on Ubuntu?"
              answer: "sudo apt install curl"

            - id: q6
              type: qcm
              question: "What does 'sudo systemctl enable apache2' do?"
              answers:
                - text: "Starts apache2 immediately"
                  correct: false
                - text: "Installs apache2"
                  correct: false
                - text: "Configures apache2 to start automatically at every boot"
                  correct: true
                - text: "Checks if apache2 is running"
                  correct: false

            - id: q7
              type: qcm
              question: "What is the difference between '>' and '>>' in shell operators?"
              answers:
                - text: "> appends to a file, >> overwrites it"
                  correct: false
                - text: "> overwrites a file, >> appends to it"
                  correct: true
                - text: "They do the same thing"
                  correct: false
                - text: "> creates directories, >> creates files"
                  correct: false

            - id: q8
              type: short_answer
              question: "What command shows the permissions, owner, and size of files in the current directory?"
              answer: "ls -l"

            - id: q9
              type: qcm
              question: "You want to find all files named 'config.txt' on the entire system. Which command do you use?"
              answers:
                - text: "grep config.txt /"
                  correct: false
                - text: "locate config.txt /"
                  correct: false
                - text: "find / -name config.txt"
                  correct: true
                - text: "search / config.txt"
                  correct: false

            - id: q10
              type: qcm
              question: "What log file would you check to find failed login attempts?"
              answers:
                - text: "/var/log/syslog"
                  correct: false
                - text: "/var/log/auth.log"
                  correct: true
                - text: "/var/log/kern.log"
                  correct: false
                - text: "/var/log/boot.log"
                  correct: false

    # ── SECTION 2 — VM PRATIQUE ───────────────────────────────────────────────
    - id: linux-exam-t2
      type: task
      title: "Section 2 — Hands-On VM"
      order: 2
      xpReward: 30
      sections:
        - type: theory
          content: |
            ## Section 2 — Hands-On Practice

            Your teacher will now provide the VM download link.

            **VM credentials:**
            - Username: `student`
            - Password: `nexus2024`

            **Your mission:**
            You are an IT support technician. A Linux workstation has been
            reported with multiple issues. Connect to the VM and fix them all.

            Once logged in, read the file on the desktop:
            ```
            cat ~/Desktop/mission-briefing.txt
            ```

            The briefing describes 4 problems to solve. For each problem:
            1. Diagnose what is wrong
            2. Apply the fix
            3. Verify the fix worked
            4. Note the exact commands you used — you will need them for the report

            **Take your time. Document everything.**

        - type: theory
          content: |
            ## The 4 problems to solve

            | # | Problem description | Hint |
            |---|--------------------|----|
            | 1 | A hidden file contains important data — find it | Fund. 1 |
            | 2 | A backup script cannot be executed | Fund. 2 |
            | 3 | A user cannot access the shared folder | Fund. 2 |
            | 4 | A service is stopped and needs to be restarted | Fund. 3 |

            Work through them in order. Each problem has a **verification step**
            that confirms your fix worked.

        - type: questions
          items:
            - id: q1
              type: short_answer
              question: "Problem 1 — What is the full path of the hidden file you found? (starts with /home/student/)"
              answer: "/home/student/.secret/flag.txt"

            - id: q2
              type: short_answer
              question: "Problem 1 — What is the content of that hidden file?"
              answer: "linux-fundamentals-complete"

            - id: q3
              type: short_answer
              question: "Problem 2 — What were the original permissions of 'backup.sh'? (format: -rw-r--r--)"
              answer: "-rw-r--r--"

            - id: q4
              type: short_answer
              question: "Problem 2 — What command did you use to fix the backup script permissions?"
              answer: "chmod u+x backup.sh"

            - id: q5
              type: short_answer
              question: "Problem 3 — What group is required to access the shared folder? (check with ls -ld /shared/)"
              answer: "support"

            - id: q6
              type: short_answer
              question: "Problem 3 — What command did you use to add the user 'student' to that group?"
              answer: "sudo usermod -aG support student"

            - id: q7
              type: short_answer
              question: "Problem 4 — What is the name of the service that was stopped?"
              answer: "cron"

            - id: q8
              type: short_answer
              question: "Problem 4 — What command did you use to start it and verify it is running?"
              answer: "sudo systemctl start cron"

    # ── SECTION 3 — RAPPORT ÉCRIT ─────────────────────────────────────────────
    - id: linux-exam-challenge
      type: challenge
      title: "Section 3 — Written Report"
      order: 3
      xpReward: 50
      sections:
        - type: theory
          content: |
            ## Section 3 — Written Report in English

            This section is worth **50 XP** and will be evaluated by your teacher.

            ---

            ## Instructions

            Write a complete IT support report in English documenting your work
            on the VM from Section 2.

            Your report must cover **all 4 problems**. For each problem, write:

            1. **What I found** — describe the problem you observed
            2. **How I diagnosed it** — explain the commands you ran and what they showed
            3. **How I fixed it** — write the exact command(s) you used
            4. **How I verified the fix** — explain how you confirmed it worked

            ---

            ## Report template

            Use this structure for each problem:

            ```
            ============================================
            LINUX SUPPORT REPORT
            Technician: [Your name]
            Date: [Today's date]
            System: linux-exam-vm
            ============================================

            PROBLEM 1 — Hidden File Recovery
            ---------------------------------
            What I found:
              [Describe what the problem was]

            How I diagnosed it:
              [Commands you ran + what they showed]

            How I fixed it:
              [Exact command(s) used]

            How I verified the fix:
              [What you ran to confirm it worked]


            PROBLEM 2 — Script Permission Error
            ------------------------------------
            What I found:
              [Describe what the problem was]

            How I diagnosed it:
              [Commands you ran + what they showed]

            How I fixed it:
              [Exact command(s) used]

            How I verified the fix:
              [What you ran to confirm it worked]


            PROBLEM 3 — User Access Issue
            ------------------------------
            What I found:
              [Describe what the problem was]

            How I diagnosed it:
              [Commands you ran + what they showed]

            How I fixed it:
              [Exact command(s) used]

            How I verified the fix:
              [What you ran to confirm it worked]


            PROBLEM 4 — Stopped Service
            ----------------------------
            What I found:
              [Describe what the problem was]

            How I diagnosed it:
              [Commands you ran + what they showed]

            How I fixed it:
              [Exact command(s) used]

            How I verified the fix:
              [What you ran to confirm it worked]


            CONCLUSION
            ----------
            [2-3 sentences summarizing the work done and
            the current status of the system]
            ============================================
            ```

        - type: theory
          content: |
            ## Evaluation criteria

            Your teacher will evaluate your report on the following criteria:

            | Criterion | Description |
            |-----------|-------------|
            | **Accuracy** | Are the commands and findings correct? |
            | **Clarity** | Is the report easy to understand? |
            | **English quality** | Is the language professional and grammatically correct? |
            | **Technical vocabulary** | Are the correct IT terms used? |
            | **Completeness** | Are all 4 problems documented? |

            ## Useful vocabulary for your report

            | Situation | English phrase |
            |-----------|---------------|
            | Describing a problem | *"The file was missing execute permission..."* |
            | Describing a command | *"I ran the command... which showed..."* |
            | Describing a fix | *"I resolved the issue by running..."* |
            | Describing verification | *"I confirmed the fix by checking..."* |
            | Describing a service | *"The service was inactive / failed / running..."* |
            | Describing permissions | *"The permissions were set to... which prevented..."* |

            ## Submission

            Submit your report to your teacher as instructed.
            Your teacher will grade it in the NEXUS backoffice.

            **Good work, Agent. Your mission is complete.**
